<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensaje enviado — DEXIA KIDS</title>
<link rel="icon" type="image/png" href="img/favicon-rana.png">
<meta http-equiv="refresh" content="5;url=index.html">
<style>
/* ==========================================================================
   DEXIA KIDS — Sistema de diseño
   Concepto: "de los sonidos a las letras" — pizarra + tiza.
   Paneles oscuros tipo pizarra como puntuación del relato, sobre un fondo
   papel cálido. Tipografía serial editorial para títulos (lectura/escritura
   como tema), sans humanista para el cuerpo.
   ========================================================================== */

:root{
  /* color */
  --ink:        #1E2A2E;   /* texto principal */
  --ink-soft:   #44545A;   /* texto secundario */
  --paper:      #FFFCF0;   /* fondo cálido */
  --paper-alt:  #FFF4CC;   /* fondo cálido, paneles claros */
  --pizarra:    #126B54;   /* panel oscuro tipo pizarra */
  --pizarra-2:  #0A4F3D;   /* pizarra, variante más oscura */
  --tiza-amarilla: #FFB82E; /* acento primario */
  --tiza-coral:    #FF5A3C; /* acento secundario */
  --tiza-celeste:  #1FC4AE; /* acento terciario, eco de la pizarra */
  --linea:      rgba(30,42,46,0.12);
  --linea-clara: rgba(251,244,234,0.22);

  /* tipografia */
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body: "Figtree", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  /* layout */
  --maxw: 1140px;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 18px 40px -22px rgba(22,48,45,0.35);
}

@font-face{font-family:"Fraunces";font-style:normal;font-weight:600;font-display:swap;src:local("Fraunces");}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
ul{margin:0;padding:0;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0 0 .5em;line-height:1.15;color:var(--pizarra-2);font-weight:600;}
p{margin:0 0 1.1em;}
:focus-visible{outline:3px solid var(--tiza-coral);outline-offset:3px;border-radius:4px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
.section{padding:84px 0;}
.section--tight{padding:56px 0;}
.section--pizarra{background:var(--pizarra);color:#F4EEE2;}
.section--pizarra h1,.section--pizarra h2,.section--pizarra h3{color:#FFFCF0;}
.section--alt{background:var(--paper-alt);}

.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tiza-coral);font-weight:700;margin-bottom:14px;
}
.section--pizarra .eyebrow{color:var(--tiza-amarilla);}

.lede{font-size:20px;color:var(--ink-soft);max-width:640px;}
.section--pizarra .lede{color:#D7E2DD;}

/* ---------- chalk underline (signature) ---------- */
.chalk{position:relative;display:inline-block;}
.chalk svg{
  position:absolute;left:-2%;right:-2%;bottom:-0.18em;width:104%;height:0.4em;
  overflow:visible;
}
.chalk svg path{
  fill:none;stroke:var(--tiza-amarilla);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:340;stroke-dashoffset:340;
  animation:draw 1.1s 0.15s ease-out forwards;
}
.section--pizarra .chalk svg path{stroke:var(--tiza-amarilla);}
@keyframes draw{to{stroke-dashoffset:0;}}

/* ---------- header / nav ---------- */
.site-header{
  position:sticky;top:0;z-index:50;
  background:rgba(251,244,234,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linea);
}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;height:84px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{height:38px;width:auto;}
.brand-tagline{display:none;}
@media (min-width:1150px){
  .brand-tagline{
    display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);border-left:1px solid var(--linea);padding-left:12px;line-height:1.3;
  }
}

.nav{display:flex;align-items:center;gap:14px;}
.nav a{font-weight:600;font-size:14px;color:var(--ink);position:relative;padding:6px 0;}
.nav a.active,.nav a:hover{color:var(--tiza-coral);}
.nav a.active::after{
  content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;border-radius:3px;background:var(--tiza-amarilla);
}
.nav-cta{
  display:flex;gap:10px;align-items:center;
}

.nav-toggle{display:none;background:none;border:0;padding:8px;cursor:pointer;}
.nav-toggle svg{display:block;width:26px;height:26px;color:var(--pizarra-2);}

.nav-btn{padding:9px 18px !important;font-size:14px !important;white-space:nowrap;}
@media (max-width:880px){
  .nav{
    position:fixed;inset:84px 0 0 0;background:var(--paper);
    flex-direction:column;align-items:flex-start;gap:0;padding:16px 24px 28px;
    transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
    border-top:1px solid var(--linea);
  }
  .nav.is-open{opacity:1;pointer-events:auto;transform:translateY(0);}
  .nav a{width:100%;padding:14px 0;border-bottom:1px solid var(--linea);}
  .nav .nav-btn{margin-top:16px;align-self:flex-start;}
  .nav-toggle{display:inline-flex;}
}

/* ---------- buttons / store badges ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 22px;border-radius:999px;font-weight:700;font-size:15px;
  background:var(--pizarra);color:#FFFCF0;border:1px solid var(--pizarra);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.btn--ghost{background:transparent;color:var(--pizarra);border-color:var(--pizarra);}
.section--pizarra .btn--ghost{color:#FFFCF0;border-color:rgba(251,244,234,0.5);}
.btn--coral{background:var(--tiza-coral);border-color:var(--tiza-coral);}

.store-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:22px;}
.store-badge img{height:48px;border-radius:8px;}
.store-badge{transition:transform .15s ease;}
.store-badge:hover{transform:translateY(-2px);}

/* ---------- hero ---------- */
.hero{padding:64px 0 40px;}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr;gap:36px;}}
.hero h1{font-size:clamp(34px,4.6vw,56px);}
.hero-art{position:relative;}
.hero-art .wave{position:absolute;inset:auto -10% -10% -10%;opacity:.5;}

.stat-inline{
  display:inline-flex;align-items:baseline;gap:6px;font-family:var(--font-display);
  color:var(--tiza-coral);font-weight:700;font-size:1.3em;
}

/* ---------- screenshot strip ---------- */
.shot-strip{
  display:flex;gap:18px;overflow-x:auto;padding:6px 4px 18px;scrollbar-width:thin;
}
.shot-strip img{
  height:200px;width:auto;border-radius:18px;flex:0 0 auto;box-shadow:var(--shadow);
  border:6px solid #fff;
}

/* ---------- quote / pizarra panel ---------- */
.quote-panel{
  background:var(--pizarra);color:#FFFCF0;border-radius:24px;
  padding:48px;display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;
}
@media (max-width:760px){.quote-panel{grid-template-columns:1fr;text-align:left;padding:32px;}}
.quote-panel img{border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.35);}
.quote-mark{font-family:var(--font-display);font-size:64px;color:var(--tiza-amarilla);line-height:0.5;display:block;margin-bottom:8px;}
.quote-panel blockquote{font-family:var(--font-display);font-size:21px;margin:0 0 16px;line-height:1.45;}
.quote-cite{font-size:14px;color:#C9D6CF;}
.quote-cite strong{color:#FFFCF0;display:block;font-size:15px;}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:28px;}
.grid--2{grid-template-columns:repeat(2,1fr);}
.grid--3{grid-template-columns:repeat(3,1fr);}
@media (max-width:880px){.grid--2,.grid--3{grid-template-columns:1fr;}}

.card{
  background:#fff;border-radius:var(--radius);padding:30px;border:1px solid var(--linea);
}
.card h3{font-size:21px;}
.card .icon{
  width:46px;height:46px;border-radius:12px;background:var(--paper-alt);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--tiza-coral);
}
.card .icon svg{width:24px;height:24px;}

/* ---------- sponsor logos ---------- */
.sponsors{
  display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:flex-start;
  padding:28px 0 6px;
}
.sponsors img{
  height:56px;width:auto;max-width:160px;object-fit:contain;
  filter:grayscale(15%);opacity:.92;
}

/* ---------- tabs (Padres / Profesionales) ---------- */
.tabs{display:flex;gap:10px;border-bottom:1px solid var(--linea);margin-bottom:32px;flex-wrap:wrap;}
.tab-btn{
  font-family:var(--font-body);font-weight:700;font-size:15px;padding:12px 4px;
  background:none;border:none;cursor:pointer;color:var(--ink-soft);position:relative;
  border-bottom:3px solid transparent;margin-bottom:-1px;
}
.tab-btn.active{color:var(--pizarra-2);border-color:var(--tiza-amarilla);}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- accordion (habilidades por edad) ---------- */
.accordion-item{border-bottom:1px solid var(--linea);}
.accordion-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:none;border:none;text-align:left;cursor:pointer;padding:22px 4px;
  font-family:var(--font-display);font-size:19px;color:var(--pizarra-2);font-weight:600;
}
.accordion-head .age-range{
  font-family:var(--font-body);font-size:13px;color:var(--tiza-coral);font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:3px;
}
.accordion-icon{flex:0 0 auto;width:22px;height:22px;color:var(--ink-soft);transition:transform .2s ease;}
.accordion-item[open] .accordion-icon{transform:rotate(45deg);}
.accordion-body{padding:0 4px 26px;color:var(--ink-soft);}
.accordion-body ul{padding-left:1.4em;list-style:disc;margin:6px 0;}
.accordion-body li{padding:5px 0;color:var(--ink-soft);line-height:1.55;}
.accordion-body li::marker{color:var(--tiza-celeste);font-size:1.1em;}
.accordion-item > summary{list-style:none;}
.accordion-item > summary::-webkit-details-marker{display:none;}

/* ---------- checklist (signos) ---------- */
.checklist{display:grid;gap:14px;}
.checklist li{
  display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--linea);
  border-radius:var(--radius-sm);padding:16px 18px;
}
.checklist li svg{flex:0 0 auto;width:22px;height:22px;color:var(--tiza-coral);margin-top:2px;}

/* ---------- team ---------- */
.team-card{display:flex;gap:20px;align-items:flex-start;}
.team-card .role{
  flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--pizarra);
  color:var(--tiza-amarilla);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:20px;font-weight:700;
}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;}
@media (max-width:880px){.contact-grid{grid-template-columns:1fr;}}
.field{margin-bottom:18px;}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;}
.field input,.field textarea{
  width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:1px solid var(--linea);
  font-family:var(--font-body);font-size:15px;background:#fff;color:var(--ink);
}
.field input:focus,.field textarea:focus{border-color:var(--tiza-celeste);}
.contact-note{font-size:14px;color:var(--ink-soft);margin-top:10px;}

/* ---------- wave divider ---------- */
.wave-divider{display:block;width:100%;height:46px;margin-top:-1px;}

/* ---------- footer ---------- */
.site-footer{background:var(--pizarra-2);color:#CFE0D9;padding:56px 0 28px;}
.site-footer a:hover{color:#fff;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;margin-bottom:36px;}
@media (max-width:760px){.footer-grid{grid-template-columns:1fr;gap:28px;}}
.footer-grid h4{color:#fff;font-family:var(--font-body);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;}
.footer-grid ul{list-style:none;padding-left:0;margin:0;}
.footer-grid li{padding:5px 0;font-size:15px;}
.social-row{display:flex;gap:14px;margin-top:18px;}
.social-row a{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--linea-clara);
  display:flex;align-items:center;justify-content:center;
}
.social-row svg{width:18px;height:18px;}
.footer-bottom{
  border-top:1px solid var(--linea-clara);padding-top:22px;font-size:13px;color:#92A8A0;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
}

/* ---------- legal page ---------- */
.legal h2{margin-top:1.6em;font-size:22px;}
.legal p,.legal li{color:var(--ink-soft);}

/* ---------- hero illustration: sonido -> letras ---------- */
.hero-art-card{background:var(--paper-alt);border-radius:28px;padding:40px 32px;border:1px solid var(--linea);}
.soundwave{display:flex;align-items:flex-end;gap:7px;height:90px;margin-bottom:34px;}
.soundwave span{flex:1;border-radius:6px;background:var(--tiza-celeste);animation:bounce 1.6s ease-in-out infinite;}
.soundwave span:nth-child(odd){background:var(--pizarra);}
.soundwave span:nth-child(1){height:30%;animation-delay:0s}
.soundwave span:nth-child(2){height:60%;animation-delay:.1s}
.soundwave span:nth-child(3){height:90%;animation-delay:.2s}
.soundwave span:nth-child(4){height:45%;animation-delay:.3s}
.soundwave span:nth-child(5){height:100%;animation-delay:.4s}
.soundwave span:nth-child(6){height:55%;animation-delay:.5s}
.soundwave span:nth-child(7){height:75%;animation-delay:.6s}
.soundwave span:nth-child(8){height:35%;animation-delay:.7s}
.soundwave span:nth-child(9){height:65%;animation-delay:.8s}
@keyframes bounce{0%,100%{transform:scaleY(.85);}50%{transform:scaleY(1.15);}}

.letter-blocks{display:flex;gap:16px;justify-content:center;}
.letter-blocks span{
  width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:30px;font-weight:700;color:#FFFCF0;box-shadow:var(--shadow);
}
.letter-blocks span:nth-child(1){background:var(--pizarra);transform:rotate(-6deg);}
.letter-blocks span:nth-child(2){background:var(--tiza-coral);transform:rotate(4deg);}
.letter-blocks span:nth-child(3){background:var(--tiza-celeste);color:var(--pizarra-2);transform:rotate(-3deg);}
.hero-art-caption{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:22px;letter-spacing:.03em;}

/* ---------- video embed ---------- */
.video-frame{position:relative;padding-top:56.25%;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--pizarra-2);}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

/* ---------- utility ---------- */
.center{text-align:center;}
.mt-0{margin-top:0;}
.kicker-divider{height:1px;background:var(--linea);margin:8px 0 40px;}

/* ---------- dropdown nav ---------- */
.nav-item{position:relative;}
.nav-item > a{
  display:inline-flex;align-items:center;gap:5px;
  font-weight:600;font-size:14px;color:var(--ink);padding:6px 0;position:relative;
}
.nav-item > a.active{color:var(--tiza-coral);}
.nav-item > a.active::after{
  content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;border-radius:3px;background:var(--tiza-amarilla);
}
.caret{width:10px;height:6px;flex:0 0 auto;transition:transform .2s ease;color:var(--ink-soft);}
.nav-item:hover .caret,.nav-item.is-open .caret{transform:rotate(180deg);}

.dropdown{
  position:absolute;top:100%;left:-16px;padding-top:12px;
  background:#fff;border-radius:var(--radius-sm);
  box-shadow:0 12px 32px -8px rgba(22,48,45,.25);
  border:1px solid var(--linea);
  padding:6px 0;min-width:220px;
  opacity:0;pointer-events:none;
  transform:translateY(6px);
  transition:opacity .18s ease,transform .18s ease;
  z-index:200;
}
.nav-item:hover .dropdown,.nav-item.is-open .dropdown{
  opacity:1;pointer-events:auto;transform:translateY(0);
}
.dropdown a{
  display:block;padding:11px 20px;font-size:14px;font-weight:600;
  color:var(--ink-soft);border:none !important;width:auto !important;
}
.dropdown a:hover{background:var(--paper-alt);color:var(--tiza-coral);}
.dropdown a:active{color:var(--tiza-coral);}

/* mobile: dropdown inline */
@media(max-width:880px){
  .nav-item{width:100%;}
  .nav-item > a{width:100%;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--linea);}
  .nav-item > a.active::after{display:none;}
  .dropdown{
    position:static;box-shadow:none;border:none;border-radius:0;
    padding:0;min-width:auto;opacity:1;pointer-events:auto;
    transform:none;transition:none;background:transparent;
    display:none;
  }
  .nav-item.is-open .dropdown{display:block;}
  .dropdown a{
    padding:11px 18px;font-size:14px;color:var(--ink-soft);
    border-bottom:1px solid var(--linea) !important;width:100% !important;display:block;
  }
}


/* ---------- app page 2-col: stack on mobile ---------- */
@media (max-width:880px){
  .app-intro-grid{grid-template-columns:1fr !important;}
}

</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🐸</div>
    <h1>¡Mensaje enviado!</h1>
    <p>Gracias por escribirnos. Te respondemos a la brevedad.</p>
    <a href="index.html">Volver al inicio</a>
    <p style="font-size:13px;color:#6B8C85;margin-top:16px;">Redirigiendo automáticamente en 5 segundos...</p>
  </div>
<script>
// DEXIA KIDS — interacciones compartidas

/* ---------- tabs: activar por clic O por hash ---------- */
function dexiaActivateTab(group, targetId) {
  var buttons = group.querySelectorAll('.tab-btn');
  var panels  = group.querySelectorAll('.tab-panel');
  buttons.forEach(function (b) {
    var isTarget = b.getAttribute('aria-controls') === targetId;
    b.classList.toggle('active', isTarget);
    b.setAttribute('aria-selected', isTarget ? 'true' : 'false');
  });
  panels.forEach(function (p) {
    p.classList.toggle('active', p.id === targetId);
  });
}

function dexiaCheckHash() {
  var hash = location.hash.replace('#', '');
  if (!hash) return;
  var map = { padres: 'tab-familias', profesionales: 'tab-profesionales' };
  var targetId = map[hash] || null;
  if (!targetId) return;
  document.querySelectorAll('[data-tabs]').forEach(function (group) {
    dexiaActivateTab(group, targetId);
    group.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

document.addEventListener('DOMContentLoaded', function () {

  /* ---------- menú móvil ---------- */
  var toggle = document.querySelector('.nav-toggle');
  var nav = document.querySelector('.nav');
  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    nav.querySelectorAll('a:not(.nav-parent)').forEach(function (link) {
      link.addEventListener('click', function () { nav.classList.remove('is-open'); });
    });
  }

  /* ---------- dropdown móvil ---------- */
  document.querySelectorAll('.nav-item').forEach(function (item) {
    var parent = item.querySelector('.nav-parent');
    if (!parent) return;
    parent.addEventListener('click', function (e) {
      if (window.innerWidth <= 880) {
        e.preventDefault();
        item.classList.toggle('is-open');
      }
    });
  });

  /* ---------- resaltar link activo ---------- */
  var here = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav a[href]:not(.btn)').forEach(function (link) {
    var target = link.getAttribute('href').split('/').pop().split('#')[0];
    if (target === here) link.classList.add('active');
  });

  /* ---------- tabs: adjuntar clics ---------- */
  document.querySelectorAll('[data-tabs]').forEach(function (group) {
    group.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        dexiaActivateTab(group, btn.getAttribute('aria-controls'));
      });
    });
  });

  /* ---------- activar tab si la URL ya tiene un hash ---------- */
  dexiaCheckHash();

  /* ---------- formulario de contacto (FormSubmit — sin JS necesario) ---------- */

});

/* ---------- activar tab cuando el hash cambia (sin recargar la página) ---------- */
window.addEventListener('hashchange', function () {
  dexiaCheckHash();
});

</script>
